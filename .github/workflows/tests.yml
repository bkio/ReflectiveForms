name: Update Test Badge

on:
  push:
    branches: [ main ]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build solution
        run: dotnet build ReflectiveForms.sln --configuration Release

      - name: Install native dependencies for LLamaSharp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgomp1

      - name: Run .NET tests and generate report
        id: dotnet-test
        run: |
          DOTNET_EXIT=0
          dotnet test ReflectiveForms.sln --configuration Release --verbosity normal --logger:"trx" --results-directory TestResults --no-build || DOTNET_EXIT=$?
          echo "DOTNET_TEST_EXIT_CODE=$DOTNET_EXIT" >> $GITHUB_ENV
          exit $DOTNET_EXIT
        continue-on-error: true

      - name: Install frontend dependencies
        run: |
          cd ReflectiveForms.Frontend
          npm ci --legacy-peer-deps

      - name: Run frontend tests
        id: frontend-test
        run: |
          cd ReflectiveForms.Frontend
          FRONTEND_EXIT=0
          npx vitest run --reporter=verbose 2>&1 | tee /tmp/frontend-test-output.txt || FRONTEND_EXIT=$?
          echo "FRONTEND_EXIT_CODE=$FRONTEND_EXIT" >> $GITHUB_ENV
          exit $FRONTEND_EXIT
        continue-on-error: true

      - name: Install Playwright browsers
        run: |
          cd ReflectiveForms.Frontend
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        id: e2e-test
        env:
          CROSSCLOUDKIT_DEBUG_PANEL_DISABLED: 'true'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          cd ReflectiveForms.Frontend
          E2E_EXIT=0
          npx playwright test --project=chromium --reporter=list 2>&1 | tee /tmp/e2e-test-output.txt || E2E_EXIT=$?
          echo "E2E_EXIT_CODE=$E2E_EXIT" >> $GITHUB_ENV
          exit $E2E_EXIT
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ReflectiveForms.Frontend/playwright-report/
            ReflectiveForms.Frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Run CreateApp tests
        id: createapp-test
        run: |
          cd ReflectiveForms.CreateApp
          CREATEAPP_EXIT=0
          node --test --test-reporter=tap tests/scaffold.test.js > /tmp/createapp-test-output.txt 2>&1 || CREATEAPP_EXIT=$?
          cat /tmp/createapp-test-output.txt
          echo "CREATEAPP_EXIT_CODE=$CREATEAPP_EXIT" >> $GITHUB_ENV
          exit $CREATEAPP_EXIT
        continue-on-error: true

      - name: Parse CreateApp test results
        run: |
          if [ -f /tmp/createapp-test-output.txt ]; then
            CREATEAPP_PASS=$(awk '/^# pass /{print $3; found=1} END{if(!found) print 0}' /tmp/createapp-test-output.txt)
            CREATEAPP_FAIL=$(awk '/^# fail /{print $3; found=1} END{if(!found) print 0}' /tmp/createapp-test-output.txt)
            CREATEAPP_CANCELLED=$(awk '/^# cancelled /{print $3; found=1} END{if(!found) print 0}' /tmp/createapp-test-output.txt)
            CREATEAPP_TOTAL=$(awk '/^# tests /{print $3; found=1} END{if(!found) print 0}' /tmp/createapp-test-output.txt)
          else
            CREATEAPP_PASS=0
            CREATEAPP_FAIL=0
            CREATEAPP_CANCELLED=0
            CREATEAPP_TOTAL=0
          fi
          echo "CREATEAPP_PASS=$CREATEAPP_PASS" >> $GITHUB_ENV
          echo "CREATEAPP_FAIL=$CREATEAPP_FAIL" >> $GITHUB_ENV
          echo "CREATEAPP_CANCELLED=$CREATEAPP_CANCELLED" >> $GITHUB_ENV
          echo "CREATEAPP_TOTAL=$CREATEAPP_TOTAL" >> $GITHUB_ENV

      - name: Parse frontend test results
        run: |
          if [ -f /tmp/frontend-test-output.txt ]; then
            FRONTEND_PASS=$(grep -cE "^\s*✓" /tmp/frontend-test-output.txt || true)
            FRONTEND_FAIL=$(grep -cE "^\s*×|^\s*✗" /tmp/frontend-test-output.txt || true)
            FRONTEND_PASS=${FRONTEND_PASS:-0}
            FRONTEND_FAIL=${FRONTEND_FAIL:-0}
            FRONTEND_TOTAL=$((FRONTEND_PASS + FRONTEND_FAIL))
          else
            FRONTEND_PASS=0
            FRONTEND_FAIL=0
            FRONTEND_TOTAL=0
          fi
          echo "FRONTEND_PASS=$FRONTEND_PASS" >> $GITHUB_ENV
          echo "FRONTEND_FAIL=$FRONTEND_FAIL" >> $GITHUB_ENV
          echo "FRONTEND_TOTAL=$FRONTEND_TOTAL" >> $GITHUB_ENV

      - name: Parse E2E test results
        run: |
          if [ -f /tmp/e2e-test-output.txt ]; then
            E2E_PASS=$(grep -cE "^\s*✓|\[chromium\].*✓" /tmp/e2e-test-output.txt || true)
            E2E_FAIL=$(grep -cE "^\s*✘|\[chromium\].*✘" /tmp/e2e-test-output.txt || true)
            # Playwright list reporter prints a summary line like "X passed" and "Y failed"
            SUMMARY_PASS=$(grep -oP '\d+(?= passed)' /tmp/e2e-test-output.txt | tail -1 || true)
            SUMMARY_FAIL=$(grep -oP '\d+(?= failed)' /tmp/e2e-test-output.txt | tail -1 || true)
            E2E_PASS=${E2E_PASS:-0}
            E2E_FAIL=${E2E_FAIL:-0}
            if [ -n "$SUMMARY_PASS" ]; then E2E_PASS=$SUMMARY_PASS; fi
            if [ -n "$SUMMARY_FAIL" ]; then E2E_FAIL=$SUMMARY_FAIL; fi
            E2E_TOTAL=$((E2E_PASS + E2E_FAIL))
          else
            E2E_PASS=0
            E2E_FAIL=0
            E2E_TOTAL=0
          fi
          echo "E2E_PASS=$E2E_PASS" >> $GITHUB_ENV
          echo "E2E_FAIL=$E2E_FAIL" >> $GITHUB_ENV
          echo "E2E_TOTAL=$E2E_TOTAL" >> $GITHUB_ENV

      - name: Parse .NET test results and create badge
        run: |
          # Install xmlstarlet for XML parsing
          sudo apt-get update && sudo apt-get install -y xmlstarlet

          # Find TRX files
          echo "Looking for TRX files..."
          find TestResults -name "*.trx" -type f || echo "No TRX files found"
          ls -la TestResults/ || echo "TestResults directory not found"

          # Process all TRX files and aggregate results
          total_tests=0
          passed_tests=0
          failed_tests=0

          for trx_file in TestResults/*.trx; do
            if [ -f "$trx_file" ]; then
              echo "Processing TRX file: $trx_file"

              file_total=$(xmlstarlet sel -N mstest="http://microsoft.com/schemas/VisualStudio/TeamTest/2010" -t -v "//mstest:Counters/@total" "$trx_file" 2>/dev/null || \
                          xmlstarlet sel -t -v "//Counters/@total" "$trx_file" 2>/dev/null || \
                          xmlstarlet sel -t -v "//*[local-name()='Counters']/@total" "$trx_file" 2>/dev/null || \
                          xmlstarlet sel -t -v "count(//*[local-name()='UnitTestResult'])" "$trx_file" 2>/dev/null || echo "0")

              file_passed=$(xmlstarlet sel -N mstest="http://microsoft.com/schemas/VisualStudio/TeamTest/2010" -t -v "//mstest:Counters/@passed" "$trx_file" 2>/dev/null || \
                           xmlstarlet sel -t -v "//Counters/@passed" "$trx_file" 2>/dev/null || \
                           xmlstarlet sel -t -v "//*[local-name()='Counters']/@passed" "$trx_file" 2>/dev/null || \
                           xmlstarlet sel -t -v "count(//*[local-name()='UnitTestResult'][@outcome='Passed'])" "$trx_file" 2>/dev/null || echo "0")

              file_failed=$(xmlstarlet sel -N mstest="http://microsoft.com/schemas/VisualStudio/TeamTest/2010" -t -v "//mstest:Counters/@failed" "$trx_file" 2>/dev/null || \
                           xmlstarlet sel -t -v "//Counters/@failed" "$trx_file" 2>/dev/null || \
                           xmlstarlet sel -t -v "//*[local-name()='Counters']/@failed" "$trx_file" 2>/dev/null || \
                           xmlstarlet sel -t -v "count(//*[local-name()='UnitTestResult'][@outcome='Failed'])" "$trx_file" 2>/dev/null || echo "0")

              echo "File results - Total: $file_total, Passed: $file_passed, Failed: $file_failed"

              total_tests=$((total_tests + file_total))
              passed_tests=$((passed_tests + file_passed))
              failed_tests=$((failed_tests + file_failed))

              echo "Running totals - Total: $total_tests, Passed: $passed_tests, Failed: $failed_tests"
              echo "---"
            fi
          done

          # Add CreateApp test results to totals. Cancelled TAP subtests are treated as
          # non-passing so the badge and README reflect the nonzero exit code.
          total_tests=$((total_tests + CREATEAPP_TOTAL))
          passed_tests=$((passed_tests + CREATEAPP_PASS))
          failed_tests=$((failed_tests + CREATEAPP_FAIL + CREATEAPP_CANCELLED))

          # Add Frontend test results to totals
          total_tests=$((total_tests + FRONTEND_TOTAL))
          passed_tests=$((passed_tests + FRONTEND_PASS))
          failed_tests=$((failed_tests + FRONTEND_FAIL))

          # Add E2E test results to totals
          total_tests=$((total_tests + E2E_TOTAL))
          passed_tests=$((passed_tests + E2E_PASS))
          failed_tests=$((failed_tests + E2E_FAIL))

          echo "Final test results:"
          echo "Total tests: $total_tests"
          echo "Passed tests: $passed_tests"
          echo "Failed tests: $failed_tests"

          # Determine badge color and message
          if [ "$total_tests" -gt "0" ] && [ "$failed_tests" -eq "0" ]; then
            color="brightgreen"
            message="${passed_tests}%2F${total_tests}%20passing"
          elif [ "$total_tests" -gt "0" ] && [ "$failed_tests" -gt "0" ]; then
            color="red"
            message="${failed_tests}%2F${total_tests}%20failing"
          else
            color="orange"
            message="no%20tests"
          fi

          # Create badge URL
          badge_url="https://img.shields.io/badge/Tests-${message}-${color}"
          echo "BADGE_URL=$badge_url" >> $GITHUB_ENV
          echo "TEST_STATUS=${passed_tests}/${total_tests}" >> $GITHUB_ENV
          echo "TOTAL_TESTS=$total_tests" >> $GITHUB_ENV
          echo "PASSED_TESTS=$passed_tests" >> $GITHUB_ENV
          echo "FAILED_TESTS=$failed_tests" >> $GITHUB_ENV

          # Debug: print all exit codes
          echo "Exit codes — dotnet: ${DOTNET_TEST_EXIT_CODE:-unset}, createapp: ${CREATEAPP_EXIT_CODE:-unset}, frontend: ${FRONTEND_EXIT_CODE:-unset}, e2e: ${E2E_EXIT_CODE:-unset}"

          # Set flag for publishing decision (all tests must pass AND exit codes must be 0)
          if [ "$total_tests" -gt "0" ] && [ "$failed_tests" -eq "0" ] && [ "${DOTNET_TEST_EXIT_CODE:-1}" -eq "0" ] && [ "${CREATEAPP_EXIT_CODE:-1}" -eq "0" ] && [ "${FRONTEND_EXIT_CODE:-1}" -eq "0" ] && [ "${E2E_EXIT_CODE:-1}" -eq "0" ]; then
            echo "TESTS_PASSED=true" >> $GITHUB_ENV
            echo "All checks passed — will publish"
          else
            echo "TESTS_PASSED=false" >> $GITHUB_ENV
            echo "Publishing skipped. Check exit codes above for the failing suite."
          fi

      - name: Update README with test badge and results
        run: |
          echo "Badge URL: $BADGE_URL"

          # Remove any existing test badge
          sed -i '/!\[Tests\]/d' README.md

          # Add the new test badge at line 2 (after the title)
          escaped_url=$(printf '%s\n' "$BADGE_URL" | sed 's/[[\.*^$(){}?+|]/\\&/g')
          sed -i '1a ![Tests]('"$escaped_url"')' README.md

          # Create test results section
          current_date=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Remove existing test results section if it exists
          sed -i '/## Test Results/,/^## /{ /^## Test Results/d; /^## /!d; }' README.md

          # Create test results section
          {
            echo "## Test Results"
            echo ""
            echo "**Last Updated:** $current_date"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| **Tests Passed** | **$PASSED_TESTS** |"
            echo "| **Tests Failed** | **$FAILED_TESTS** |"
            echo "| **Total Tests** | **$TOTAL_TESTS** |"
            echo ""
          } > test_results.tmp

          sed -i '/A schema-driven admin panel framework/r test_results.tmp' README.md

          # Clean up temporary file
          rm test_results.tmp

          echo "Updated README with test status: $TEST_STATUS"
          echo "Test Results: Passed=$PASSED_TESTS, Failed=$FAILED_TESTS, Total=$TOTAL_TESTS"

          # Show the updated badge and results section
          head -20 README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "Update test results: $PASSED_TESTS passed, $FAILED_TESTS failed, $TOTAL_TESTS total"
            git push
          fi

      - name: Generate version number
        if: env.TESTS_PASSED == 'true'
        run: |
          # Generate version: YYYY.MONTHDAY.run_number (valid 3-part SemVer for both NuGet and npm)
          # %-m removes leading zero from month, %d keeps 2-digit day
          # Examples: May 12 → 512, Jan 5 → 105, Dec 31 → 1231
          YEAR=$(date +%Y)
          MONTHDAY=$(date +%-m%d)
          PACKAGE_VERSION="${YEAR}.${MONTHDAY}.${{github.run_number}}"

          echo "Generated version: $PACKAGE_VERSION"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Pack NuGet packages
        if: env.TESTS_PASSED == 'true'
        run: |
          echo "All tests passed! Creating NuGet packages with version $PACKAGE_VERSION..."

          projects_to_pack=(
            "./ReflectiveForms.Core/ReflectiveForms.Core.csproj"
          )

          echo "Projects to pack:"
          printf '  %s\n' "${projects_to_pack[@]}"
          echo ""

          pack_count=0
          for project in "${projects_to_pack[@]}"; do
            if [ ! -f "$project" ]; then
              echo "⚠️  Skipping (not found): $project"
              continue
            fi
            echo "Packing: $project"
            dotnet pack "$project" --configuration Release --output ./nupkgs --no-build -p:PackageVersion=$PACKAGE_VERSION
            if [ $? -eq 0 ]; then
              pack_count=$((pack_count + 1))
              echo "✅ Successfully packed: $project"
            else
              echo "❌ Failed to pack: $project"
            fi
            echo ""
          done

          echo "Successfully packed $pack_count packages with version $PACKAGE_VERSION"
          echo "Created packages:"
          ls -la ./nupkgs/

      - name: Publish to NuGet
        if: env.TESTS_PASSED == 'true'
        run: |
          echo "Publishing packages to NuGet.org..."

          for package in ./nupkgs/*.nupkg; do
            echo "Publishing $package..."
            dotnet nuget push "$package" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

          echo "Successfully published all packages to NuGet!"

      - name: Publish @reflectiveforms/frontend to npm
        if: env.TESTS_PASSED == 'true'
        run: |
          cd ReflectiveForms.Frontend
          npm ci
          npm run build:lib
          npm version $PACKAGE_VERSION --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @reflectiveforms/create-app to npm
        if: env.TESTS_PASSED == 'true'
        run: |
          cd ReflectiveForms.CreateApp
          npm version $PACKAGE_VERSION --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        if: env.TESTS_PASSED == 'true'
        run: |
          echo "✅ Tests passed and packages published!"
          echo "Test Results: $TEST_STATUS"
          echo "Package Version: $PACKAGE_VERSION"
          echo ""
          echo "Published packages:"
          echo "  - ReflectiveForms.Core $PACKAGE_VERSION (NuGet)"
          echo "  - @reflectiveforms/frontend $PACKAGE_VERSION (npm)"
          echo "  - @reflectiveforms/create-app $PACKAGE_VERSION (npm)"
